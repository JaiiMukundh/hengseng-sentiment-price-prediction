name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify console script
        run: sentpred --help
      - name: Unit tests
        run: python -m pytest
      - name: Offline end-to-end demo
        run: python -m sentpred demo
      - name: Upload demo report
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/demo
