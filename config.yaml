# HengSeng Sentiment Price Prediction - pipeline configuration.
# Secrets (APIFY_API_TOKEN, EXA_API_KEY) are read from the environment / .env, never from this file.

window:
  social_days: 10            # current-sentiment report window
  history_days: 30           # scrape/training window (report stays at social_days)
  price_period: 1y           # price history used for technicals and walk-forward training

exchanges:
  HKEX:
    tz: Asia/Hong_Kong
    close: "16:00"
    assets:
      - ticker: 0700.HK
        name: Tencent Holdings
        keywords: ["Tencent", "腾讯", "騰訊", "$0700", "00700"]
      - ticker: 9988.HK
        name: Alibaba Group
        keywords: ["Alibaba", "阿里巴巴", "阿里", "$9988", "09988"]
      - ticker: 3690.HK
        name: Meituan
        keywords: ["Meituan", "美团", "美團", "$3690", "03690"]
      - ticker: 0005.HK
        name: HSBC Holdings
        keywords: ["HSBC", "汇丰", "匯豐", "$0005", "00005"]
      - ticker: 1810.HK
        name: Xiaomi
        keywords: ["Xiaomi", "小米", "$1810", "01810"]
  KRX:
    tz: Asia/Seoul
    close: "15:30"
    assets:
      - ticker: 005930.KS
        name: Samsung Electronics
        keywords: ["Samsung Electronics", "삼성전자"]
      - ticker: 000660.KS
        name: SK hynix
        keywords: ["SK hynix", "SK하이닉스", "하이닉스"]
      - ticker: 035420.KS
        name: NAVER
        keywords: ["NAVER", "네이버"]
      - ticker: 035720.KS
        name: Kakao
        keywords: ["Kakao", "카카오"]
      - ticker: 005380.KS
        name: Hyundai Motor
        keywords: ["Hyundai Motor", "현대차", "현대자동차"]

# Optional holdings, shown in the report's position column. Set quantity to 0 or remove the entry if flat.
# You can also put `position: {quantity: N, avg_price: X}` directly on an asset above.
positions:
  HKEX: {}
  KRX: {}

sources:
  # Social source 1 for HKEX (LIHKG forum keyword search)
  lihkg:
    enabled: true
    exchanges: [HKEX]
    actor: claude_code_reviewer~lihkg-scraper
    max_items: 100
    date_from: 2w
    max_charge_usd: 3
  # Social source 2 (Telegram keyword search, per-exchange discovery bias)
  telegram:
    enabled: true
    exchanges: [HKEX, KRX]
    actor: parseforge~telegram-keyword-search-scraper
    max_items: 200
    after_date: "30 days"
    discovery:
      HKEX: {language: zh-TW, country: hk}
      KRX: {language: ko, country: kr}
    # Optional: extra public channels searched on top of auto-discovery.
    channels:
      HKEX: []
      KRX: []
    max_charge_usd: 3
  # Social source 1 for KRX (Naver Finance stock discussion board, JS-rendered)
  naver_discussion:
    enabled: true
    exchanges: [KRX]
    actor: apify~playwright-scraper
    board_url: "https://m.stock.naver.com/front-api/discussion/list?discussionType=domesticStock&itemCode={code}&pageSize=50&isHolderOnly=false&excludesItemNews=false&isItemNewsOnly=false"
    max_assets_per_run: 1     # one ticker per Actor run, otherwise 5 x 30 days can hit the 60-minute limit
    timeout_s: 3600
    max_charge_usd: 3
  # Optional KRX source (English TeamBlind). Kept disabled by default: its keyword search returns
  # relevance-ranked posts that are usually older than the 10-day window, and the Actor does not
  # support Blind's Korean /kr/ site.
  blind:
    enabled: false
    exchanges: [KRX]
    actor: hypebridge~blind-post-scraper
    search_url: "https://www.teamblind.com/search/{query}"
    max_items: 100            # $18 per 1,000 posts on this Actor - keep it tight
    max_charge_usd: 3

news:
  provider: exa
  num_results: 20

model:
  min_train_dates: 60        # walk-forward warm-up, in trading sessions
  test_block: 5              # sessions per out-of-sample block
  ridge_alpha: 1.0
  sentiment_alpha: 10.0    # stronger shrinkage for the short-history sentiment panel
  sentiment_model: ridge   # ridge = stable linear model; rf available for comparison
  sentiment_shrinkage: 0.5 # calibrate noisy forecasts toward zero
  signal_threshold: 0.005    # |predicted return| above this -> LONG / SHORT, otherwise FLAT
  sentiment_direction: 0.1   # |sentiment score| above this -> BULLISH / BEARISH
