positions:
  HKEX: {}
  KRX: {}
sources:
  lihkg:
    enabled: true
    exchanges:
    - HKEX
    actor: claude_code_reviewer~lihkg-scraper
    max_items: 100
    date_from: 2w
    max_charge_usd: 3
  telegram:
    enabled: true
    exchanges:
    - HKEX
    - KRX
    actor: parseforge~telegram-keyword-search-scraper
    max_items: 200
    after_date: 30 days
    discovery:
      HKEX:
        language: zh-TW
        country: hk
      KRX:
        language: ko
        country: kr
    channels:
      HKEX: []
      KRX: []
    max_charge_usd: 3
  naver_discussion:
    enabled: true
    exchanges:
    - KRX
    actor: apify~playwright-scraper
    board_url: https://m.stock.naver.com/front-api/discussion/list?discussionType=domesticStock&itemCode={code}&pageSize=50&isHolderOnly=false&excludesItemNews=false&isItemNewsOnly=false
    max_assets_per_run: 1
    timeout_s: 3600
    max_charge_usd: 3
  blind:
    enabled: false
    exchanges:
    - KRX
    actor: hypebridge~blind-post-scraper
    search_url: https://www.teamblind.com/search/{query}
    max_items: 100
    max_charge_usd: 3
news:
  provider: exa
  num_results: 20
model:
  min_train_dates: 60
  test_block: 5
  ridge_alpha: 1.0
  sentiment_alpha: 10.0
  sentiment_model: ridge
  sentiment_shrinkage: 0.5
  signal_threshold: 0.005
  sentiment_direction: 0.1
